[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dancenotation-mcp"
version = "0.1.0"
description = "Headless-first dance notation MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cairosvg>=2.7"]

[project.optional-dependencies]
# Music engraving (generate_score's music_source input / render_music tool).
# Also requires a local `lilypond` binary on PATH; both degrade gracefully
# to "music output omitted" rather than failing the whole score if missing.
music = ["music21>=9.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
